<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário</title>
</head>
<body>

    <h1 class="h1_login">Login</h1>

    <table>
        <tr>
            <form id="formLogin" action="#" method="post">

                <td><input type="email" id="lemail" name="lemail" placeholder="Digite seu email" required><br></td>
        </tr>
        <tr>
                <td><label for="lsenha">Senha:</label><br>
                <td><input type="password" id="lsenha" name="lsenha" placeholder="Digite sua senha" required><br></td>
            </form>
        </tr>
    </table>
